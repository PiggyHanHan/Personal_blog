# 博客站点配置（HTTPS 版）——与服务器 /etc/nginx/sites-available/blog 内容一致
# 证书：阿里云 SSL，放在 /etc/nginx/ssl/（由 setup-nginx.ps1 / setup-ssl.ps1 部署）
#   blog.example.com.fullchain.pem  证书 + 中间证书（fullchain，浏览器不报链不完整）
#   blog.example.com.key            私钥（chmod 600）
# 【编码】本文件必须保存为不带 BOM 的 UTF-8

# ── 互动接口限流 ──────────────────────────────────────────────
# limit_req_zone 只能写在 http 上下文里，而本文件整个就是被 include 进 http 的
# （/etc/nginx/sites-enabled/blog），所以直接写在文件顶层即可，不用另开 conf.d 文件——
# 少一个文件就少一份"两边不同步"的风险（本文件与服务器上那份是双份，改一处必须同步）。
# 键用 $binary_remote_addr：这是 nginx 眼里的真实对端地址，客户端伪造不了。
limit_req_zone $binary_remote_addr zone=blog_api:10m rate=120r/m;
# 被限流时回 429（默认 503 会被误当成"服务挂了"）；前端对非 2xx 一律静默降级
limit_req_status 429;

# ── 防域名寄生（改动前务必先 `nginx -t`）────────────────────────
# 背景：nginx 没有 default_server 兜底、且 server_name 里带 "_" 时，等于
# 「任何域名只要 A 记录指到本机，就能用自己的域名打开本站」。
# 曾发生过的真事：别人的域名解析到了这台机器，打开就是本站；对方被爬虫扫到首页
# 公开的邮箱后，把一封模板化的投诉函发到了站主私人邮箱。
# 443 侧同理：没有 default_server 时 nginx 会用第一个站的证书兜底，虽然浏览器
# 会报证书不匹配（表现为"打不开"），但 curl -k / 无头浏览器照样能取到内容。
# 所以这里给 80 / 443 各加一个 default_server 兜底：非白名单 Host 一律拒绝。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/hijack.log;
    return 444;
}

# 80：域名跳 HTTPS。裸 IP 直接落到上面的 default_server 被 444
# （保留 IP 明文入口等于给寄生域名留后门，且 IP 本身也不该外露）。
# ⚠️ 还没有域名、只能先用 IP 访问的话，把上面那个 default_server 块整段注释掉，
#    并把下面 server_name 末尾补一个 `_` 兜底。
server {
    listen 80;
    listen [::]:80;
    # 只认白名单域名
    server_name blog.example.com www.blog.example.com;

    # 1. 域名一律 301 跳 HTTPS。
    #    注意：不能靠 $ssl_server_name 判断——SNI 只在 TLS 握手里才有，
    #    明文 HTTP 请求$ssl_server_name 恒为空，那个判断永远不会生效。
    #    也不能写成裸 return 301：裸 IP 访问会被跳进证书里没有的 IP，必然报错，
    #    所以这里显式把「Host 是裸 IP」排除在外。
    if ($host !~* "^\d{1,3}(\.\d{1,3}){3}$") {
        return 301 https://$host$request_uri;
    }

    # 2. Next.js 的 JS/CSS 构建产物
    location /_next/static/ {
        alias /var/www/blog/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. PDF 附件（直接从 content/files/ 读取，不经过 Node）
    location /files/ {
        alias /var/www/blog/content/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. 其他静态资源（背景图、开屏素材、压缩配图等）
    #    先到 public/ 找，找不到再转发给 Node
    location / {
        root /var/www/blog/public;
        try_files $uri @nextjs;
    }

    # 5. 互动接口限流：访客上报与点赞/表情。
    #    ⚠️ 只限这两个精确路径，**不要**写成 location ^~ /api/：
    #       /api/view 与 /api/download 会被 pdf.js 用大量 Range 请求打，
    #       限流会直接把手机端的 PDF 阅读打断。
    #    try_files 的写法与上面的 location / 同一套路：文件不存在就转给 Node。
    location = /api/stats {
        root /var/www/blog/public;
        limit_req zone=blog_api burst=40 nodelay;
        try_files /__api_rate_limited__ @nextjs;
    }
    location = /api/like {
        root /var/www/blog/public;
        limit_req zone=blog_api burst=20 nodelay;
        try_files /__api_rate_limited__ @nextjs;
    }

    # 6. 转发给 Next.js 服务
    location @nextjs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 443 兜底：SNI 与白名单不符时直接拒绝 TLS 握手。
# 不落证书、不返回任何内容——寄生域名连"证书不匹配"的提示都不会有，彻底打不开。
# ssl_reject_handshake 要求 nginx ≥ 1.19.4；此块不配证书是允许的。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log /var/log/nginx/hijack.log;
}

# 443：正式入口。域名（含 www）走这里，静态资源与 Node 代理规则与 80 那套完全一致
server {
    # http2 写在 listen 里（Ubuntu 的 nginx 1.24 还没有独立的 http2 on; 指令，那是 1.25.1+ 才有）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com www.blog.example.com;

    ssl_certificate     /etc/nginx/ssl/blog.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.example.com.key;

    # 会话复用 + 超时
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # TLS 1.0/1.1 已废弃（DigiCert 也不再支持），只留 1.2/1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP stapling：证书签发机构是 DigiCert，配好能省一次客户端查询
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/blog.example.com.fullchain.pem;
    resolver 223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout 5s;

    # HSTS：告诉浏览器以后一律走 HTTPS。确认站点全站 HTTPS 正常后再开，别急着加 preload
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 1. Next.js 的 JS/CSS 构建产物
    location /_next/static/ {
        alias /var/www/blog/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. PDF 附件（直接从 content/files/ 读取，不经过 Node）
    location /files/ {
        alias /var/www/blog/content/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. 其他静态资源（背景图、开屏素材、压缩配图等）
    #    先到 public/ 找，找不到再转发给 Node
    location / {
        root /var/www/blog/public;
        try_files $uri @nextjs;
    }

    # 4. 互动接口限流：访客上报与点赞/表情。
    #    ⚠️ 只限这两个精确路径，**不要**写成 location ^~ /api/：
    #       /api/view 与 /api/download 会被 pdf.js 用大量 Range 请求打，
    #       限流会直接把手机端的 PDF 阅读打断。
    location = /api/stats {
        root /var/www/blog/public;
        limit_req zone=blog_api burst=40 nodelay;
        try_files /__api_rate_limited__ @nextjs;
    }
    location = /api/like {
        root /var/www/blog/public;
        limit_req zone=blog_api burst=20 nodelay;
        try_files /__api_rate_limited__ @nextjs;
    }

    # 5. 转发给 Next.js 服务
    location @nextjs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
