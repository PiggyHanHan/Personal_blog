# 博客站点配置（HTTPS 版）——与服务器 /etc/nginx/sites-available/blog 内容一致
# 证书：阿里云 SSL，放在 /etc/nginx/ssl/（由 setup-nginx.ps1 / setup-ssl.ps1 部署）
#   blog.example.com.fullchain.pem  证书 + 中间证书（fullchain，浏览器不报链不完整）
#   blog.example.com.key            私钥（chmod 600）
# 【编码】本文件必须保存为不带 BOM 的 UTF-8

# 80：域名跳 HTTPS；裸 IP 保留明文（IP 未在证书 SAN 里，一跳必撞证书错误）
server {
    listen 80;
    listen [::]:80;
    # 既绑定了具体域名，又保留了 _ 作为 IP 访问的兜底
    server_name blog.example.com www.blog.example.com _;

    # 1. 域名一律 301 跳 HTTPS。
    #    注意：不能靠 $ssl_server_name 判断——SNI 只在 TLS 握手里才有，
    #    明文 HTTP 请求$ssl_server_name 恒为空，那个判断永远不会生效。
    #    也不能写成裸 return 301：裸 IP 访问会被跳进证书里没有的 IP，必然报错，
    #    所以这里显式把「Host 是裸 IP」排除在外。
    if ($host !~* "^\d{1,3}(\.\d{1,3}){3}$") {
        return 301 https://$host$request_uri;
    }

    # 2. Next.js 的 JS/CSS 构建产物
    location /_next/static/ {
        alias /var/www/blog/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. PDF 附件（直接从 content/files/ 读取，不经过 Node）
    location /files/ {
        alias /var/www/blog/content/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. 其他静态资源（背景图、开屏素材、压缩配图等）
    #    先到 public/ 找，找不到再转发给 Node
    location / {
        root /var/www/blog/public;
        try_files $uri @nextjs;
    }

    # 5. 转发给 Next.js 服务
    location @nextjs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 443：正式入口。域名（含 www）走这里，静态资源与 Node 代理规则与 80 那套完全一致
server {
    # http2 写在 listen 里（Ubuntu 的 nginx 1.24 还没有独立的 http2 on; 指令，那是 1.25.1+ 才有）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com www.blog.example.com;

    ssl_certificate     /etc/nginx/ssl/blog.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.example.com.key;

    # 会话复用 + 超时
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # TLS 1.0/1.1 已废弃（DigiCert 也不再支持），只留 1.2/1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP stapling：证书签发机构是 DigiCert，配好能省一次客户端查询
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/blog.example.com.fullchain.pem;
    resolver 223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout 5s;

    # HSTS：告诉浏览器以后一律走 HTTPS。确认站点全站 HTTPS 正常后再开，别急着加 preload
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 1. Next.js 的 JS/CSS 构建产物
    location /_next/static/ {
        alias /var/www/blog/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. PDF 附件（直接从 content/files/ 读取，不经过 Node）
    location /files/ {
        alias /var/www/blog/content/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. 其他静态资源（背景图、开屏素材、压缩配图等）
    #    先到 public/ 找，找不到再转发给 Node
    location / {
        root /var/www/blog/public;
        try_files $uri @nextjs;
    }

    # 4. 转发给 Next.js 服务
    location @nextjs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
